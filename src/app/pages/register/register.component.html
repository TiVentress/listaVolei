<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Criar Conta</h3>

          <form #form="ngForm" (ngSubmit)="onSubmit(form)">
            <div class="mb-3">
              <label for="name" class="form-label">Nome Completo</label>
              <input type="text" class="form-control" name="name" ngModel required #name="ngModel">
              <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-danger small mt-1">
                Nome é obrigatório.
              </div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Celular (WhatsApp)</label>
              <input type="tel" class="form-control" name="phone" ngModel required #phone="ngModel"
                placeholder="(XX) XXXXX-XXXX">
              <div *ngIf="phone.invalid && (phone.dirty || phone.touched)" class="text-danger small mt-1">
                Celular é obrigatório.
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" name="email" ngModel required email #email="ngModel"
                placeholder="seuemail@exemplo.com">
              <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger small mt-1">
                <div *ngIf="email.errors?.['required']">Email é obrigatório.</div>
                <div *ngIf="email.errors?.['email']">Email inválido.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Senha</label>
              <input type="password" class="form-control" name="password" ngModel required minlength="6"
                #password="ngModel" placeholder="Mínimo 6 caracteres">
              <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger small mt-1">
                <div *ngIf="password.errors?.['required']">Senha é obrigatória.</div>
                <div *ngIf="password.errors?.['minlength']">A senha deve ter no mínimo 6 caracteres.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirmar Senha</label>
              <input type="password" class="form-control" name="confirmPassword" ngModel required
                #confirmPassword="ngModel">
            </div>

            <div *ngIf="error" class="alert alert-danger py-2 mt-3">{{ error }}</div>

            <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="form.invalid">Criar Conta</button>
          </form>

          <div class="text-center mt-3">
            <a routerLink="/login">Já tem uma conta? Faça login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
