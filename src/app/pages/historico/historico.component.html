<div class="historico-container">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold">Histórico de Partidas</h1>
      <p class="text-muted">Relembre aqui os jogos que já aconteceram.</p>
    </div>

    <!-- Indicador de Carregamento -->
    <div *ngIf="isLoading" class="d-flex justify-content-center my-5">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <!-- Mensagem de Lista Vazia -->
    <div *ngIf="!isLoading && jogosPassados.length === 0" class="text-center py-5 empty-state">
        <i class="bi bi-calendar2-x fs-1 text-muted"></i>
        <p class="mt-2">Nenhum jogo anterior encontrado no histórico.</p>
    </div>

    <!-- Grid de Cards dos Jogos -->
    <div *ngIf="!isLoading && jogosPassados.length > 0" class="row">
      <div *ngFor="let jogo of jogosPassados" class="col-12 col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm jogo-card-historico">
          <div class="card-body d-flex flex-column">
            <div>
              <span class="badge mb-2" [ngClass]="{'bg-secondary': jogo.status === 'Cancelado', 'bg-success': jogo.status !== 'Cancelado'}">
                {{ jogo.status === 'Cancelado' ? 'Cancelado' : 'Finalizado' }}
              </span>
              <h5 class="card-title">{{ jogo.local }}</h5>
              <p class="card-text mb-2">
                <small class="text-muted">{{ jogo.data | date:'dd/MM/yyyy' }} às {{ jogo.hora }}</small>
              </p>
            </div>
            <div class="mt-auto">
              <a [routerLink]="['/jogos']" [fragment]="'jogo-' + jogo.id" class="btn btn-sm btn-outline-primary w-100">
                Ver Detalhes do Jogo
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
