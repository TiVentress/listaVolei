<div class="container mt-4">
  <div class="text-center mb-4">
    <h2 class="display-6">Histórico de Jogos</h2>
    <p class="lead text-muted">Revise as partidas que já aconteceram.</p>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-content-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <div *ngIf="!isLoading && jogosPassados.length === 0" class="alert alert-info text-center">
    Ainda não há jogos no seu histórico.
  </div>

  <div *ngIf="!isLoading && jogosPassados.length > 0" class="row">
    <div *ngFor="let jogo of jogosPassados" class="col-12 col-md-6 col-lg-4 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ jogo.local }}</h5>
          <p class="card-text">
            <small class="text-muted">{{ jogo.data | date:'dd/MM/yyyy' }} às {{ jogo.hora }}</small>
          </p>
          <span class="badge" [ngClass]="{'bg-secondary': jogo.status === 'Cancelado', 'bg-success': jogo.status !== 'Cancelado'}">
            Finalizado
          </span>
        </div>
        <div class="card-footer bg-light">
          <!-- Este link leva para a página principal, destacando o jogo clicado -->
          <a [routerLink]="['/jogos']" [fragment]="'jogo-' + jogo.id" class="btn btn-sm btn-outline-secondary">
            Ver Detalhes
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
