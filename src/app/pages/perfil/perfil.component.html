<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Meu Perfil</h3>
        </div>
        <div class="card-body">
          
          <form [formGroup]="perfilForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" class="form-control" formControlName="nome">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" formControlName="email">
              <small class="form-text text-muted">O email não pode ser alterado.</small>
            </div>

            <div class="mb-3">
              <label for="celular" class="form-label">Celular</label>
              <input type="text" id="celular" class="form-control" formControlName="celular" placeholder="(XX) XXXXX-XXXX">
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="perfilForm.invalid">Salvar Alterações</button>
          
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
