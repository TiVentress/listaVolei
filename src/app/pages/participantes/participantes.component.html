<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <h2 class="text-center mb-4">Gerenciar Jogo</h2>

      <div class="mb-4">
        <input type="text" class="form-control" placeholder="Filtrar por nome..." [(ngModel)]="filtroNome">
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">Participantes Inscritos ({{ participantesFiltrados.length }})</h5>
        </div>
        <ul class="list-group list-group-flush">
          <li *ngIf="participantesFiltrados.length === 0" class="list-group-item text-muted">
            Nenhum participante confirmado.
          </li>
          <li *ngFor="let p of participantesFiltrados"
            class="list-group-item d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center">
              <span>{{ p.nome }}</span>
              
              <button *ngIf="isCreator" (click)="mostrarDetalhes(p)"
                class="btn btn-sm btn-outline-info ms-3 py-0 px-2">
                <i class="bi bi-person-lines-fill"></i> </button>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-sm" 
                [ngClass]="p.presencaConfirmada ? 'btn-secondary' : 'btn-outline-success'"
                (click)="alternarConfirmacao(p)">
                {{ p.presencaConfirmada ? 'Desconfirmar' : 'Confirmar' }}
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="remover(p.id!)">Remover</button>
            </div>
          </li>
        </ul>
      </div>

      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">Lista de Espera ({{ listaDeEsperaFiltrada.length }})</h5>
        </div>
        <ul class="list-group list-group-flush">
          <li *ngIf="listaDeEsperaFiltrada.length === 0" class="list-group-item text-muted">
            A lista de espera está vazia.
          </li>
          <li *ngFor="let p of listaDeEsperaFiltrada"
            class="list-group-item d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center">
              <span>{{ p.nome }}</span>
              <button *ngIf="isCreator" (click)="mostrarDetalhes(p)"
                class="btn btn-sm btn-outline-info ms-3 py-0 px-2">
                <i class="bi bi-person-lines-fill"></i>
              </button>
            </div>

            <button class="btn btn-sm btn-outline-danger" (click)="remover(p.id!)">Remover</button>
          </li>
        </ul>
      </div>

    </div>
  </div>
</div>
